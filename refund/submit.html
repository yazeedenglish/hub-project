
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تم استلام طلبك | Yazeed English</title>

    <meta
        name="description"
        content="تم استلام طلب الاسترجاع بنجاح"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

    <style>
        .thank-you-card {
            max-width: 560px;
            margin: 60px auto;
            padding: 40px 28px;
            text-align: center;
            background: var(--card, #fff);
            color: var(--ink, #00273a);
            border: 1px solid var(--line, #DCDFD6);
            border-radius: 24px;
        }

        .success-icon {
            width: 76px;
            height: 76px;
            display: grid;
            place-items: center;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: #e4f6e9;
            color: #15803d;
            font-size: 38px;
            font-weight: 800;
        }

        .thank-you-card h1 {
            margin-bottom: 14px;
            font-size: clamp(26px, 5vw, 36px);
        }

        .thank-you-card p {
            line-height: 1.9;
            color: var(--ink-soft, #5B645F);
        }

        .home-button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            border-radius: 12px;
            background: var(--indigo, #00689b);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="container">

            <main class="thank-you-card">

                <div class="success-icon" aria-hidden="true">
                    ✓
                </div>

                <h2>تم استلام طلبك بنجاح</h1>

                <p>
                   نأسف لأن تجربتك معنا لم تكن عند مستوى تطلعاتك
                </p>

                <p>
ستتم مراجعة طلبك     خلال 24 - 48 ساعة          </p>

                  <p>
                 وخلال هذه الفترة، نأمل أن تمنح منتجاتنا فرصة إضافية<br>
                </p>

                  <p>
                 وإذا غيرت رأيك ورغبت في إلغاء طلب الاسترجاع
                </p>

                <p>فيسعدنا تواصلك معنا</p>

                <a class="home-button" href="/">
                    العودة إلى الموقع
                </a>

            </main>

        </div>
    </div>
</body>

</html>
