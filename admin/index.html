<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Yazeed English — Admin</title>
    
    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap"
        rel="stylesheet"
    >
</head>


<body>


    <!-- =========================================
         HEADER
    ========================================= -->

    <header>

        <div class="header-inner">

            <div class="brand">
                Yazeed English
            </div>

            <div class="admin-label">
                لوحة تحكم الإدارة
            </div>

        </div>

    </header>



    <!-- =========================================
         MAIN
    ========================================= -->

    <main>


        <div class="page-title">

            <h1>
                لوحة التحكم
            </h1>

            <p>
                إدارة طلبات العملاء وصلاحيات الدورات
            </p>

        </div>



        <!-- =====================================
             STATISTICS
        ====================================== -->

        <section class="stats">


            <div class="stat-card">

                <div class="stat-title">
                    إجمالي الطلبات
                </div>

                <div
                    class="stat-number"
                    id="totalOrders"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    STEP
                </div>

                <div
                    class="stat-number"
                    id="stepCount"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    English
                </div>

                <div
                    class="stat-number"
                    id="englishCount"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Trab6
                </div>

                <div
                    class="stat-number"
                    id="trab6Count"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Writing
                </div>

                <div
                    class="stat-number"
                    id="writingCount"
                >
                    0
                </div>

            </div>


        </section>



        <!-- =====================================
             ORDERS
        ====================================== -->

        <section class="card">


            <div class="card-header">

                <h2>
                    الطلبات
                </h2>

                <button
                    class="primary"
                    id="openCreateBtn"
                >
                    + إنشاء طلب
                </button>

            </div>



            <!-- CONTROLS -->

            <div class="controls">


                <div class="search-box">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="ابحث برقم الطلب..."
                    >

                </div>


                <div style="min-width: 180px;">

                    <select id="productFilter">

                        <option value="all">
                            جميع الدورات
                        </option>

                        <option value="step">
                            STEP
                        </option>

                        <option value="english">
                            English
                        </option>

                        <option value="trab6">
                            Trab6
                        </option>

                        <option value="writing">
                            Writing
                        </option>

                    </select>

                </div>


                <div style="min-width: 160px;">

                    <select id="statusFilter">

                        <option value="all">
                            جميع الحالات
                        </option>

                        <option value="active">
                            نشط
                        </option>

                        <option value="inactive">
                            غير نشط
                        </option>

                    </select>

                </div>


            </div>



            <!-- TABLE -->

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                رقم الطلب
                            </th>

                            <th>
                                الدورات
                            </th>

                            <th>
                                الحالة
                            </th>

                            <th>
                                الإجراءات
                            </th>

                        </tr>

                    </thead>


                    <tbody id="ordersTableBody">

                    </tbody>

                </table>

            </div>


            <div
                class="empty"
                id="emptyState"
                style="display: none;"
            >
                لا توجد طلبات مطابقة.
            </div>


        </section>


    </main>



    <!-- =========================================
         CREATE / EDIT MODAL
    ========================================= -->

    <div
        class="modal-overlay"
        id="modalOverlay"
    >

        <div class="modal">


            <div class="modal-header">

                <h2 id="modalTitle">
                    إنشاء طلب جديد
                </h2>

                <button
                    class="close-btn"
                    id="closeModalBtn"
                >
                    ×
                </button>

            </div>



            <div class="form-group">

                <label for="modalOrderNumber">
                    رقم الطلب
                </label>

                <input
                    type="text"
                    id="modalOrderNumber"
                    placeholder="أدخل رقم الطلب"
                    autocomplete="off"
                >

            </div>



            <div class="form-group">

                <label>
                    الدورات المسموح بها
                </label>


                <div class="products">


                    <label class="product-option">

                        <input
                            type="checkbox"
                            id="modalStep"
                        >

                        <span>
                            STEP
                        </span>

                    </label>


                    <label class="product-option">

                        <input
                            type="checkbox"
                            id="modalEnglish"
                        >

                        <span>
                            English
                        </span>

                    </label>


                    <label class="product-option">

                        <input
                            type="checkbox"
                            id="modalTrab6"
                        >

                        <span>
                            Trab6
                        </span>

                    </label>


                    <label class="product-option">

                        <input
                            type="checkbox"
                            id="modalWriting"
                        >

                        <span>
                            Writing
                        </span>

                    </label>


                </div>

            </div>



            <div class="modal-footer">

                <button
                    class="secondary"
                    id="cancelModalBtn"
                >
                    إلغاء
                </button>

                <button
                    class="primary"
                    id="saveOrderBtn"
                >
                    حفظ الطلب
                </button>

            </div>


        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>

</body>

</html>
