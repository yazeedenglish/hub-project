<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Yazeed English — الإدارة</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap"
        rel="stylesheet"
    >

</head>


<body>


    <!-- =====================================================
         LOGIN
    ====================================================== -->

    <section
        class="login-screen"
        id="loginScreen"
    >

        <div class="login-box">

            <div class="login-icon">
                🔐
            </div>

            <div class="brand">
                YAZEED ENGLISH
            </div>

            <h1>
                لوحة الإدارة
            </h1>

            <p class="subtitle">
                تسجيل الدخول لإدارة الوصول
            </p>


            <form id="loginForm">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="أدخل البريد الإلكتروني"
                    autocomplete="email"
                    required
                >


                <label for="password">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="أدخل كلمة المرور"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="submit"
                    class="primary-button"
                >
                    تسجيل الدخول
                </button>

            </form>


            <div
                class="message"
                id="loginMessage"
            ></div>

        </div>

    </section>



    <!-- =====================================================
         ADMIN PANEL
    ====================================================== -->

    <section
        class="admin-screen"
        id="adminScreen"
    >

        <header class="admin-header">

            <div>

                <div class="brand">
                    YAZEED ENGLISH
                </div>

                <h1>
                    إدارة الوصول
                </h1>

            </div>


            <div class="header-actions">

                <a
                    href="/"
                    class="home-button"
                >
                    الرئيسية
                </a>

                <button
                    type="button"
                    class="logout-button"
                    id="logoutButton"
                >
                    تسجيل الخروج
                </button>

            </div>

        </header>



        <main class="admin-container">


            <!-- =================================================
                 ADD BLACKLIST
            ================================================== -->

            <section class="panel">

                <div class="panel-header">

                    <div>

                        <h2>
                            إلغاء الوصول
                        </h2>

                        <p>
                            أضف منتجًا إلى قائمة الوصول الملغى
                        </p>

                    </div>

                </div>


                <form id="blacklistForm">


                    <div class="form-grid">


                        <div class="field">

                            <label for="orderNumber">
                                رقم الطلب
                            </label>

                            <input
                                type="text"
                                id="orderNumber"
                                placeholder="مثال: 234567890"
                                inputmode="numeric"
                                maxlength="9"
                                autocomplete="off"
                                required
                            >

                        </div>



                        <div class="field">

                            <label for="product">
                                المنتج
                            </label>

                            <select id="product" required>

                                <option value="">
                                    اختر المنتج
                                </option>

                                <option value="step">
                                    STEP
                                </option>

                                <option value="english">
                                    English
                                </option>

                                <option value="trab6">
                                    Trab6
                                </option>

                                <option value="writing">
                                    Writing
                                </option>

                            </select>

                        </div>



                        <div class="field field-wide">

                            <label for="reason">
                                السبب
                                <span>
                                    اختياري
                                </span>
                            </label>

                            <input
                                type="text"
                                id="reason"
                                placeholder="مثال: استرجاع"
                                maxlength="100"
                                autocomplete="off"
                            >

                        </div>


                    </div>


                    <button
                        type="submit"
                        class="danger-button"
                    >
                        إلغاء الوصول
                    </button>


                    <div
                        class="message"
                        id="blacklistMessage"
                    ></div>

                </form>

            </section>



            <!-- =================================================
                 BLACKLIST
            ================================================== -->

            <section class="panel">

                <div class="panel-header">

                    <div>

                        <h2>
                            الوصول الملغى
                        </h2>

                        <p>
                            جميع المنتجات التي تم إلغاء الوصول إليها
                        </p>

                    </div>


                    <button
                        type="button"
                        class="refresh-button"
                        id="refreshButton"
                    >
                        تحديث
                    </button>

                </div>


                <div
                    class="table-wrapper"
                    id="tableWrapper"
                >

                    <div class="loading">
                        جاري تحميل البيانات...
                    </div>

                </div>

            </section>


        </main>

    </section>



    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="admin.js"></script>

</body>

</html>
