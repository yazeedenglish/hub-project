<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Yazeed English | اللغة الإنجليزية</title>

    <!-- Tajawal -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="top-header">

        <a
            href="/"
            class="brand"
            aria-label="Yazeed English"
        >

            <!--
                Replace this with your real logo later.

                Example:

                <img
                    src="assets/logo.png"
                    alt="Yazeed English"
                    class="brand-logo"
                >
            -->

        <!-- This displays your actual Yazeed English logo. -->
        <img
            src="https://file.yazeedenglish.com/logo.png"
            alt="Yazeed English Logo"
            class="brand-logo"
        >

            <div class="brand-text">

                <strong>Yazeed English</strong>

                <span>منصة يزيد للانجليزية</span>

            </div>

        </a>


        <div class="header-actions">

            <button
    type="button"
    class="theme-btn"
    id="themeToggle"
    aria-label="تغيير المظهر"
    title="تغيير المظهر"
>
    <i data-lucide="moon" id="themeIcon"></i>
</button>

        </div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main-website">


        <!-- =================================================
             SECTIONS
        ================================================== -->

        <section class="content-section">

            <div class="section-heading">

                <span class="section-label">
                    
                </span>

                <h2>
                   
                </h2>

                <p>
                
                </p>

            </div>


            <div class="english-grid">


                <!-- =========================================
                     TYPING
                ========================================== -->

                <a
                    href="/english/writing/typing"
                    class="english-card"
                    id="book-card"
                    style="--card-delay: 0s;"
                >

                    <div class="card-media">

                        <div class="card-icon">
                            ⌨️
                        </div>

                    </div>


                    <div class="card-content">

                        <div>

                            <h3>
                              لوحة المفاتيح
                            </h3>

                            <p>
                              
                       </p>

                        </div>


                        <div class="card-action">

                            <span>
                                دخول
                            </span>

                            <span class="arrow">
                                ←
                            </span>

                        </div>

                    </div>

                </a>


                <!-- =========================================
                     HANDWRITING
                ========================================== -->

                <a
                    href="/english/writing/hand"
                    class="english-card"
                    id="grammar-card"
                    style="--card-delay: 0.12s;"
                >

                    <div class="card-media">

                        <div class="card-icon">
                            ✍️
                        </div>

                    </div>


                    <div class="card-content">

                        <div>

                            <h3>
                               خط اليد
                            </h3>

                            <p>
                                
                            </p>

                        </div>


                        <div class="card-action">

                            <span>
                                دخول
                            </span>

                            <span class="arrow">
                                ←
                            </span>

                        </div>

                    </div>

                </a>


            </div> <!-- END grid -->

         </section>

        </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="site-footer">

        <div class="footer-line"></div>

        <p>
            Yazeed English
        </p>

    </footer>


<script src="../access.js"></script>

<script>
    initializeCourseAccess("english");
</script>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();
</script>

<script type="module" src="script.js"></script>

</body>

</html>
