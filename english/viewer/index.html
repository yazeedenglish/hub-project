<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#00689b">
    <title>عارض الملفات التعليمي | Yazeed English Hub</title>

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
<script>
    /* apply saved theme before first paint (no flash) */
    try {
        var t = localStorage.getItem('ye-theme');
        if (t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark');
        }
    } catch (e) {}
</script>

<!-- Icon sprite -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></symbol>
    <symbol id="i-zoomin" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></symbol>
    <symbol id="i-zoomout" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect width="14" height="14" x="5" y="5" rx="2"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M2 14h4"/><path d="M10 8h4"/><path d="M18 16h4"/></symbol>
    <symbol id="i-slides" viewBox="0 0 24 24"><path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
</svg>

<div class="app" id="app">

    <!-- HEADER -->
    <header class="top-header" id="topHeader">
        <div class="brand">
            <img class="brand-logo" id="brandLogo" src="logo.png" alt="Yazeed English Hub">
            <div class="brand-mark" id="brandMark" hidden>YE</div>
            <div class="brand-text">
                <strong>Yazeed English Hub</strong>
                <span id="docTitle">عارض الملفات التعليمي</span>
            </div>
        </div>

        <div class="theme-buttons">
            <button class="theme-btn" id="themeBtn" type="button" aria-label="تبديل الوضع الداكن" title="الوضع الداكن">
                <svg class="i"><use id="themeIcon" href="#i-moon"/></svg>
            </button>
        </div>
    </header>

    <div class="progress" id="progress" aria-hidden="true"><span id="progressBar"></span></div>

    <!-- WORKSPACE -->
    <main class="workspace" id="workspace">

        <aside class="thumbs" id="thumbs" aria-label="الصفحات المصغرة">
            <div class="thumbs-head">
                <strong>الصفحات</strong>
                <button class="icon-btn small" id="thumbsClose" type="button" aria-label="إغلاق"><svg class="i"><use href="#i-x"/></svg></button>
            </div>
            <div class="thumbs-list" id="thumbsList"></div>
        </aside>
        <div class="thumbs-backdrop" id="thumbsBackdrop"></div>

        <section class="stage" id="stage">
            <div class="viewport" id="viewport" tabindex="-1">
                <div class="pages" id="pages"></div>
            </div>

            <button class="side-arrow prev" id="sidePrev" type="button" aria-label="الصفحة السابقة"><svg class="i"><use href="#i-left"/></svg></button>
            <button class="side-arrow next" id="sideNext" type="button" aria-label="الصفحة التالية"><svg class="i"><use href="#i-right"/></svg></button>

            <button class="icon-btn slide-exit" id="slideExit" type="button" aria-label="الخروج من عرض الشرائح" title="خروج (Esc)"><svg class="i"><use href="#i-x"/></svg></button>

            <div class="toast" id="toast" role="status"></div>

            <div class="state show loading" id="state">
                <div class="state-card">
                    <div class="spinner"></div>
                    <h2 id="stateTitle">جارٍ تحميل الملف…</h2>
                    <p id="stateDesc"></p>
                    <div class="bar"><span id="stateBar"></span></div>
                    <div class="state-actions">
                        <button class="course-btn primary" id="stateRetry" type="button">إعادة المحاولة</button>
                        <button class="course-btn secondary" id="stateOpen" type="button">فتح ملف من جهازك</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- TOOLBAR -->
    <footer class="toolbar" id="toolbar" dir="ltr">

        <div class="tb-group tb-left">
            <button class="icon-btn hide-slide" id="thumbsBtn" type="button" title="الصفحات المصغرة (T)" aria-label="الصفحات المصغرة" aria-expanded="false"><svg class="i"><use href="#i-grid"/></svg></button>
            <button class="icon-btn" id="zoomOut" type="button" title="تصغير (-)" aria-label="تصغير"><svg class="i"><use href="#i-zoomout"/></svg></button>
            <button class="chip zoom-label" id="zoomLabel" type="button" title="إعادة الحجم الأصلي">100%</button>
            <button class="icon-btn" id="zoomIn" type="button" title="تكبير (+)" aria-label="تكبير"><svg class="i"><use href="#i-zoomin"/></svg></button>
        </div>

        <div class="tb-group tb-nav">
            <button class="icon-btn" id="prevBtn" type="button" title="السابق (←)" aria-label="الصفحة السابقة"><svg class="i"><use href="#i-left"/></svg></button>
            <label class="page-box">
                <input id="pageInput" type="number" inputmode="numeric" min="1" value="1" aria-label="رقم الصفحة">
                <span>/ <b id="pageTotal">–</b></span>
            </label>
            <button class="icon-btn" id="nextBtn" type="button" title="التالي (→)" aria-label="الصفحة التالية"><svg class="i"><use href="#i-right"/></svg></button>
        </div>

        <div class="tb-group tb-right">
            <button class="icon-btn primary" id="readBtn" type="button" title="قراءة الصفحة (R)" aria-label="قراءة الصفحة"><svg class="i"><use id="readIcon" href="#i-play"/></svg></button>
            <button class="icon-btn" id="stopBtn" type="button" title="إيقاف القراءة" aria-label="إيقاف القراءة" disabled><svg class="i"><use href="#i-stop"/></svg></button>
            <button class="chip" id="speedChip" type="button" title="سرعة القراءة">1×</button>
            <button class="icon-btn" id="voiceBtn" type="button" title="الصوت والسرعة" aria-label="الصوت والسرعة" aria-haspopup="dialog" aria-expanded="false"><svg class="i"><use href="#i-sliders"/></svg></button>
            <button class="icon-btn only-slide" id="autoBtn" type="button" title="تشغيل تلقائي" aria-label="تشغيل تلقائي" aria-pressed="false"><svg class="i"><use id="autoIcon" href="#i-play"/></svg></button>
            <button class="chip only-slide" id="autoSecChip" type="button" title="مدة كل شريحة">8s</button>
            <button class="icon-btn" id="slideBtn" type="button" title="عرض الشرائح (F)" aria-label="عرض الشرائح"><svg class="i"><use href="#i-slides"/></svg></button>
        </div>

        <!-- Voice & speed panel -->
        <div class="panel" id="voicePanel" role="dialog" aria-label="إعدادات الصوت" dir="rtl">
            <div class="panel-head">
                <strong>الصوت والسرعة</strong>
                <button class="icon-btn small" id="panelClose" type="button" aria-label="إغلاق"><svg class="i"><use href="#i-x"/></svg></button>
            </div>

            <label class="field-label" for="voiceSelect">الصوت</label>
            <select id="voiceSelect" class="field"></select>

            <div class="field-label row">
                <label for="rateRange">سرعة القراءة</label>
                <output id="rateOut">1×</output>
            </div>
            <input type="range" id="rateRange" min="0.5" max="2" step="0.05" value="1">
            <div class="rate-chips" id="rateChips"></div>

            <div class="field-label">عند النقر على النص</div>
            <div class="seg" id="modeSeg">
                <button type="button" data-mode="sentence" aria-pressed="true">قراءة الجملة</button>
                <button type="button" data-mode="word" aria-pressed="false">قراءة الكلمة</button>
            </div>

            <label class="switch">
                <input type="checkbox" id="autoNext">
                <span>الانتقال تلقائياً للصفحة التالية بعد «قراءة الصفحة»</span>
            </label>

            <button class="course-btn secondary" id="testVoice" type="button">جرّب الصوت</button>
        </div>
    </footer>
</div>

<div class="sr-only" id="announce" aria-live="polite"></div>
<input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
</body>
</html>
