<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Yazeed English — بوابة التفعيل</title>


<!-- =====================================================
     TAJAWAL
====================================================== -->

<link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap"
    rel="stylesheet"
>

</head>

<body>

<div class="access-screen">


    <main class="access-box">


        <!-- =================================================
             LOCK ICON
        ================================================== -->

        <div class="access-logo">

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <rect
                    x="4"
                    y="10"
                    width="16"
                    height="11"
                    rx="2"
                ></rect>

                <path
                    d="M8 10V7a4 4 0 0 1 8 0v3"
                ></path>

                <circle
                    cx="12"
                    cy="15.5"
                    r="1"
                    fill="currentColor"
                    stroke="none"
                ></circle>

            </svg>

        </div>


        <!-- =================================================
             BRAND
        ================================================== -->

        <div class="access-brand">
            YAZEED ENGLISH
        </div>


        <!-- =================================================
             TITLE
        ================================================== -->

        <h1>
            بوابة التفعيل
        </h1>

        <!-- =================================================
             DESCRIPTION
        ================================================== -->

        <p class="access-description">
           أدخل رقم الطلب لتفعيل المحتوى الخاص بك
        </p>


        <!-- =================================================
             FORM
        ================================================== -->

        <form id="accessForm">


            <label
                class="order-label"
                for="orderNumber"
            >
                رقم الطلب
            </label>


            <input
                class="password-input"
                type="text"
                id="orderNumber"
                name="orderNumber"
                placeholder="أدخل رقم الطلب"
                autocomplete="off"
                required
            >


            <!-- =============================================
                 CONSENT
            ============================================== -->

            <label
                class="consent-label"
                id="consentLabel"
            >

                <input
                    type="checkbox"
                    id="consent"
                >

                <span>
         أتعهد بعدم مشاركة محتويات الدورات أو الملفات  
                </span>

            </label>


            <!-- =============================================
                 CONSENT ERROR
            ============================================== -->

            <div
                class="consent-error"
                id="consentError"
                role="alert"
            >

                <span class="consent-error-icon">
                    !
                </span>

                <span>
                    يجب الموافقة على التعهد قبل المتابعة.
                </span>

            </div>


            <!-- =============================================
                 BUTTON
            ============================================== -->

            <button
                class="continue-btn"
                type="submit"
            >
                متابعة
            </button>


        </form>


        <!-- =================================================
             MESSAGE
        ================================================== -->

        <div id="message"></div>

    </main>


</div>


<!-- =========================================================
     SUPABASE
========================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- =========================================================
     CUSTOMER ACTIVATION
========================================================== -->

<script src="activate.js"></script>

</body>

</html>
